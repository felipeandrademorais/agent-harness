# MCP Servers Configuration
#
# This file configures MCP (Model Context Protocol) servers that provide
# tools to the PrimaryAgent. These are external processes that the harness
# connects to via stdio or SSE.
#
# Server config fields:
#   name    — unique identifier for logging/debugging
#   type    — "stdio" (subprocess) or "sse" (HTTP)
#   command — command + args for stdio servers (list format)
#   url     — endpoint URL for sse servers
#   env     — optional environment variables (dict)
#
# To add a new MCP server:
#   1. Install the server package (usually via npm or pip)
#   2. Add the configuration below
#   3. Restart the harness

servers:
  # ---------------------------------------------------------------------------
  # Filesystem — read/write files, list directories
  # ---------------------------------------------------------------------------
  # Install: npm install -g @modelcontextprotocol/server-filesystem
  - name: filesystem
    type: stdio
    command:
      - npx
      - -y
      - "@modelcontextprotocol/server-filesystem"
      - /Users/admin/Documents  # allowed root directory

  # ---------------------------------------------------------------------------
  # Web Search via Brave Search API
  # ---------------------------------------------------------------------------
